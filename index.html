<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aquarium A</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="style.css">
</head>
<body>
  <svg width="0" height="0" aria-hidden="true" focusable="false"
       style="position:absolute">
    <filter id="highlightRolloff" color-interpolation-filters="sRGB">
      <!-- Piecewise-linear tone curve: identity to ~0.6, then compressed, so
           white lands at 0.78 and nothing below midtone moves. Same table on
           R, G and B keeps their ratios, so hue survives. -->
      <feComponentTransfer>
        <feFuncR type="table" tableValues="0 0.2 0.4 0.58 0.70 0.78"/>
        <feFuncG type="table" tableValues="0 0.2 0.4 0.58 0.70 0.78"/>
        <feFuncB type="table" tableValues="0 0.2 0.4 0.58 0.70 0.78"/>
      </feComponentTransfer>
    </filter>
  </svg>

  <div class="video-wrap" id="videoWrap">
    <video id="player" src="assets/ambiance-recode.mp4" loop playsinline preload="auto"></video>
    <canvas id="bubbles" class="overlay"></canvas>
    <canvas id="glare" class="overlay"></canvas>
    <canvas id="ripples" class="overlay"></canvas>
    <!-- future overlays (click targets, counters, clock) go inside .video-wrap -->

    <div class="landing" id="landing">
      <button id="landingPlay" type="button" aria-label="Play" title="Play">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>
      </button>
    </div>

    <div class="controls">
      <button id="menuToggle" type="button" data-state="closed" aria-expanded="false"
              aria-controls="controlsGroup" aria-label="Show controls" title="Show controls">
        <svg class="i-menu" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16v2H4zm0 5h16v2H4zm0 5h16v2H4z"/></svg>
        <svg class="i-close" viewBox="0 0 24 24" aria-hidden="true"><path d="M18.3 7.1 16.9 5.7 12 10.6 7.1 5.7 5.7 7.1l4.9 4.9-4.9 4.9 1.4 1.4 4.9-4.9 4.9 4.9 1.4-1.4-4.9-4.9z"/></svg>
      </button>

      <div class="controls-group" id="controlsGroup" hidden>
      <div class="volume" id="volume">
        <button id="volumeBtn" type="button" data-level="high"
                aria-label="Volume 100%" title="Volume 100%"
                aria-expanded="false" aria-controls="volumePanel">
          <svg class="i-vol-high" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9v6h4l5 5V4L8 9H4zm11.5 3a4.5 4.5 0 0 0-2.5-4v8a4.5 4.5 0 0 0 2.5-4zM13 2.3v2.1c3 .9 5 3.5 5 6.6s-2 5.7-5 6.6v2.1c4.1-.9 7-4.5 7-8.7s-2.9-7.8-7-8.7z"/></svg>
          <svg class="i-vol-low" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9v6h4l5 5V4L8 9H4zm11.5 3a4.5 4.5 0 0 0-2.5-4v8a4.5 4.5 0 0 0 2.5-4z"/></svg>
          <svg class="i-vol-mute" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9v6h4l5 5V4L8 9H4zm15.1 3 2.4-2.4-1.1-1.1-2.4 2.4-2.4-2.4-1.1 1.1 2.4 2.4-2.4 2.4 1.1 1.1 2.4-2.4 2.4 2.4 1.1-1.1-2.4-2.4z"/></svg>
        </button>
        <div class="volume-panel" id="volumePanel" hidden>
          <input id="volumeSlider" class="volume-slider" type="range"
                 min="0" max="1" step="0.01" value="1" aria-label="Volume">
        </div>
      </div>

      <button id="toggle" type="button" data-state="paused" aria-label="Play" title="Play">
        <svg class="i-play" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>
        <svg class="i-pause" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 5h4v14H6zm8 0h4v14h-4z"/></svg>
      </button>
      <button id="stop" type="button" aria-label="Stop" title="Stop">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6h12v12H6z"/></svg>
      </button>
      <span class="sep" aria-hidden="true"></span>

      <button id="bubbleToggle" type="button" data-state="paused" aria-label="Play bubbles" title="Play bubbles">
        <svg class="i-play" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>
        <svg class="i-pause" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 5h4v14H6zm8 0h4v14h-4z"/></svg>
      </button>
      <button id="bubbleStop" type="button" aria-label="Stop bubbles" title="Stop bubbles">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6h12v12H6z"/></svg>
      </button>

      <span class="sep" aria-hidden="true"></span>

      <button id="glareToggle" type="button" data-state="paused" aria-label="Play glare" title="Play glare">
        <svg class="i-play" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>
        <svg class="i-pause" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 5h4v14H6zm8 0h4v14h-4z"/></svg>
      </button>
      <button id="glareStop" type="button" aria-label="Stop glare" title="Stop glare">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6h12v12H6z"/></svg>
      </button>

      <span class="sep" aria-hidden="true"></span>

      <button id="rippleToggle" type="button" data-state="paused"
              aria-label="Enable click ripples" title="Enable click ripples">
        <svg class="i-ripple-on" viewBox="0 0 24 24" aria-hidden="true">
          <circle class="dot" cx="12" cy="12" r="1.7"/>
          <circle cx="12" cy="12" r="5"/>
          <circle cx="12" cy="12" r="8.6"/>
        </svg>
        <svg class="i-ripple-off" viewBox="0 0 24 24" aria-hidden="true">
          <circle class="dot" cx="12" cy="12" r="1.7"/>
          <circle cx="12" cy="12" r="5" stroke-dasharray="2.2 3.2"/>
        </svg>
      </button>

      <span class="sep" aria-hidden="true"></span>

      <button id="filterToggle" type="button" data-state="off" aria-pressed="false"
              aria-label="Highlight rolloff off" title="Highlight rolloff off">
        <svg class="i-filter" viewBox="0 0 24 24" aria-hidden="true">
          <circle class="ring" cx="12" cy="12" r="8.4"/>
          <path class="half" d="M12 3.6a8.4 8.4 0 0 1 0 16.8z"/>
        </svg>
      </button>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
  <script src="volume.js"></script>
  <script src="overlay.js"></script>
  <script src="bubbles.js"></script>
  <script src="glare.js"></script>
  <script src="ripples.js"></script>
  <script src="filter.js"></script>
  <script src="menu.js"></script>
  <script src="landing.js"></script>

  <script>
    // Cache the video on disk so repeat visits don't re-stream it.
    // Needs HTTPS — silently skipped when opening the file from disk.
    if ('serviceWorker' in navigator) {
      addEventListener('load', function () {
        navigator.serviceWorker.register('sw.js').catch(function () {});
        if (navigator.storage && navigator.storage.persist) {
          navigator.storage.persist().catch(function () {});
        }
      });
    }
  </script>
</body>
</html>
